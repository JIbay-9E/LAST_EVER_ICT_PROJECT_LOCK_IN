<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
    <title>Attendance Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
    
    <py-config>
        packages = ['numpy', 'matplotlib']
    </py-config>
   
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            min-height: 100vh;
        }
        #navbar {
            background: #1e5ccb;
            padding: 0 0 0 0;
            margin: 0;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 2px 8px rgba(30,92,203,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        #navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }
        #navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start;
        }
        #navbar ul li {
            margin: 0 18px 0 0;
        }
        #navbar ul li:last-child {
            margin-right: 0;
        }
        #navbar ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.05rem;
            padding: 18px 0;
            display: block;
            transition: color 0.2s;
        }
        #navbar ul li a:hover {
            color: #ffd700;
        }
        #navbar form {
            margin: 0 0 0 24px;
            display: flex;
            align-items: center;
        }
        #navbar input.form-control {
            width: 160px;
            font-size: 0.97rem;
            padding: 4px 8px;
        }
        #navbar button {
            font-size: 0.97rem;
            padding: 4px 14px;
        }
        .hero {
            max-width: 900px;
            margin: 36px auto 0;
            padding: 0 20px;
            text-align: center;
        }
        .hero h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            letter-spacing: -0.03em;
            color: #1e5ccb;
        }
        .hero p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 24px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(30,92,203,0.08);
            max-width: 400px;
            margin: 0 auto 32px;
            padding: 28px 24px 18px 24px;
        }
        .card label {
            display: block;
            margin-bottom: 10px;
            text-align: left;
            color: #1e5ccb;
            font-weight: 500;
        }
        .card select, .card input {
            width: 100%;
            padding: 8px;
            margin-bottom: 14px;
            border-radius: 6px;
            border: 1px solid #b5c9f5;
            font-size: 1rem;
        }
        .card button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            background: #1e5ccb;
            color: #fff;
            font-weight: bold;
            border: none;
            font-size: 1.05rem;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .card button:hover {
            background: #1747a6;
        }
        #plot {
            background: white;
            margin: 0 auto 24px auto;
            padding: 10px;
            border-radius: 10px;
            max-width: 500px;
        }
        @media (max-width: 600px) {
            #navbar .container, .hero, .card, #plot {
                max-width: 98vw;
                padding: 0 4vw;
            }
        }
    </style>
</head>
<body>

    <div id="navbar">
        <div class="container">
            <ul>
                <li><a href="index.html">Classmate list</a></li>
                <li><a href="att.html">Attendance tracker</a></li>
                <li><a href="pic.html">Gallery</a></li>
            </ul>
            <form class="d-flex" style="margin-top: 0;">
                <input class="form-control me-2" type="text" placeholder="Search">
                <button class="btn btn-primary" type="button">Search</button>
            </form>
        </div>
    </div>

    <div class="hero">
        <h1>Attendance Tracker</h1>
        <p>Track your absences for each day of the week. Enter the number and submit to update the chart below.</p>
    </div>
    <div class="card">
        <label for="day-select">Select Day</label>
        <select id="day-select">
            <option value="0">Monday</option>
            <option value="1">Tuesday</option>
            <option value="2">Wednesday</option>
            <option value="3">Thursday</option>
            <option value="4">Friday</option>
        </select>
        <label for="absence-count">Absences</label>
        <input type="number" id="absence-count" placeholder="0">
        <button class="btn-submit" py-click="update_data">Submit</button>
    </div>

    <div id="plot"></div>

    <script type="py" src="main.py"></script>

</body>
</html>
